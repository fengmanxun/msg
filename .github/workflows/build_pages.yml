name: Build pages
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Inject version variable
        run: |
          sed -i "s/{{MSG_URL}}/${{secrets.msg_url}}/g" index.html

      - name: Deploy
        uses: actions/upload-pages-artifact@v2
        with:
          path: .
      - uses: actions/deploy-pages@v2
