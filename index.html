<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Sender</title>
</head>
<body>

<textarea id="a" placeholder="Type your message here"></textarea>
<button onclick="sendMessage()">Send</button>

<div id="c" style="display: none; color: green;"></div>

<script>
async function sendMessage() {
    const input = document.getElementById("a").value.trim();
    const statusBox = document.getElementById("c");

    if (input === "") {
        alert("Please enter a message to send.");
        return;
    }

    const url = "{{MSG_URL}}" + encodeURIComponent(input);

    try {
        const response = await fetch(url, {
            method: "GET"
        });

        if (response.ok) {
            const text = await response.text();
            statusBox.textContent = text;
            statusBox.style.display = "block";

            setTimeout(() => {
                statusBox.style.display = "none";
            }, 3000);

            document.getElementById("a").value = "";
        } else {
            console.error("Remote server status:", response.statusText);
        }
    } catch (err) {
        console.error("Error sending message:", err);
    }
}
</script>

</body>
</html>
